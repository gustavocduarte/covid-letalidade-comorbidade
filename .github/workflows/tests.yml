name: Testes

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Instalar dependências
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Rodar lint (ruff)
        run: ruff check .
      - name: Rodar testes (pytest, sem o golden)
        run: pytest
