name: Testes

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Rodar testes (pytest)
        run: pytest
      - name: Rodar lint (ruff)
        run: ruff check .
